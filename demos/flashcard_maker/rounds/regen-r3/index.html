<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flashcard Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500&family=Roboto:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="index.css" />
  <script type="importmap">
    {
      "imports": {
        "@google/genai": "https://esm.sh/@google/genai@^1.0.0"
      }
    }
  </script>
</head>
<body>
  <main class="container">
    <h1>Flashcard Generator</h1>
    <p class="subtitle">
      Enter a topic or a list of terms and definitions to generate flashcards using the Gemini API.
    </p>
    <textarea
      id="topicInput"
      placeholder="Enter topic (e.g., Ancient Rome) or 'Term: Definition' pairs (one per line)"
      aria-label="Topic or Term: Definition pairs"
    ></textarea>
    <button id="generateButton" type="button">Generate Flashcards</button>
    <div id="errorMessage" class="error-message" role="status" aria-live="polite"></div>
    <div id="flashcardsContainer" class="flashcards-container"></div>
  </main>
  <script type="module" src="index.tsx"></script>
</body>
</html>

schemaVersion: 1

meta:
  id: handdrawn-map-kit-site-desktop
  title: HANDDRAWN-MAP-KIT · Official Atlas
  lang: en
  seed: hmk-site-desktop-v2

canvas:
  w: 300
  h: 740
  ppm: 7
  paper: hotpress
  border: true
  pad: 4.8
  inner: 8.0

style:
  preset: vintage-atlas
  palette:
    ocean: '#cde0e6'
    oceanShallow: '#bad3dc'
    land: '#f3e8cc'
    landWarm: '#efe0bc'
    river: '#5d93b3'
    crimson: '#b8372e'

geo:
  # Gentle oblique projection strictly for authentic curved graticules & border degree ticks
  projection:
    lon0: 136
    lat0: 34
    scale: 0.085
    cx: 150
    cy: 370
    rotDeg: -6
  waterlines:
    r1: 1.4
    r2: 2.9
  land:
    # Island I — Isle of Origin (Hero, y: 64..184 — fits completely on 1440x900 first screen)
    - color: '#f3e8cc'
      coords: mm
      pts:
        - [20, 74]
        - [48, 66]
        - [106, 65]
        - [168, 67]
        - [226, 65]
        - [272, 68]
        - [285, 84]

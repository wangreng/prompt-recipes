layers:
  graticule:
    step: 5
  mountains:
    # Northern ridge of Hero Island's eastern scenic headland
    - id: mtn-hero-east
      peaks:
        - [196, 85, 9, 8, true]
        - [212, 83, 10, 10, true]
        - [228, 86, 9, 8, false]
        - [245, 84, 10, 9, true]
        - [262, 86, 8, 7, false]
  rivers:
    # Small scenic river winding from eastern Hero mountains to eastern bay
    - coords: mm
      nib: 0.36
      pts: [[212, 86], [220, 93], [234, 96], [250, 95], [270, 99], [284, 104]]
  routes:
    # Dashed maritime routes linking the five islands in reading order
    - coords: mm
      color: '#b8372e'
      pts: [[148, 182], [144, 193], [150, 204]]
    - coords: mm
      color: '#b8372e'
      pts: [[150, 314], [156, 325], [148, 336]]
    - coords: mm
      color: '#b8372e'
      pts: [[148, 474], [142, 485], [150, 496]]
    - coords: mm
      color: '#b8372e'
      pts: [[150, 620], [155, 630], [148, 640]]
  waves:
    - { x: 132, y: 51, scale: 0.85, count: 2 }
    - { x: 218, y: 53, scale: 0.85, count: 2 }
    - { x: 182, y: 191, scale: 0.95, count: 2 }
    - { x: 112, y: 324, scale: 0.9, count: 2 }
    - { x: 262, y: 325, scale: 0.85, count: 2 }
    - { x: 168, y: 484, scale: 0.9, count: 2 }
    - { x: 34, y: 486, scale: 0.85, count: 2 }
    - { x: 96, y: 630, scale: 0.9, count: 2 }

